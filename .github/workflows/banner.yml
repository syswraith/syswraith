name: Update README Banner

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install gallery-dl requests

      - name: Download Pinterest board
        run: |
          mkdir -p banners
          gallery-dl \
            -D banners \
            "${{ secrets.PINTEREST_BOARD_URL }}"

      - name: Update README
        run: python scripts/update_banner.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md banners/

          git diff --cached --quiet || \
          git commit -m "chore: update README banner"

          git push
